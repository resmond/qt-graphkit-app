[project]
name = "qt-graphkit-app"
version = "0.0.1"
description = "Standalone app that hosts and tests the qt-graphkit component."
readme = "README.md"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Richard Esmond" }]
requires-python = ">=3.11"
dependencies = [
    "qt-graphkit",
    # The app picks the binding: PySide6, matched to FreeCAD's env.
    "PySide6-Essentials==6.11.3",
    # ConsoleWidget (decision D4 in qt-graphkit).
    "pyqtgraph>=0.14",
]

[project.scripts]
qt-graphkit-app = "qt_graphkit_app.main:main"

[tool.uv.sources]
qt-graphkit = { path = "../qt-graphkit", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.11"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
